-o '%(uploader)s/%(playlist|).20s/%(timestamp>%Y%m%d_%H%M%S)s - %(title).80s [%(format_id)s] [%(id)s].%(ext)s'
--format-sort res,vcodec,ext
--playlist-reverse --compat-options playlist-index
--add-chapters
--match-filter '!is_live'
--embed-metadata --embed-thumbnail
--min-sleep-interval 5 --max-sleep-interval 30
#--restrict-filenames

# File names for --split-chapters; without that option this template is unused.
-o 'chapter:!Chapters/%(uploader)s/%(playlist|).20s/%(timestamp>%Y%m%d_%H%M%S)s - %(title).80s [%(format_id)s] [%(id)s]/%(section_number).3d. %(section_title).32s.%(ext)s'
#--keep-video --split-chapters
