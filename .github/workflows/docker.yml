name: Create and publish a Docker image

on:
  workflow_dispatch:

  schedule:
    # Daily: the check job is a single API call and only builds when yt-dlp
    # published a new release, so a weekly cron just adds up to six days of lag
    # (2026.10.26 shipped on a Monday and would have waited for Sunday).
    # 03:13 UTC is after yt-dlp's usual late-evening-UTC release window.
    - cron: '13 3 * * *'

  push:
    branches: [ "main" ]

  repository_dispatch:
    types: [yt-dlp-release]

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  REPOSITORY: ${{ github.repository_owner }}/ytdlp

jobs:
  check-yt-dlp-release:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      yt_dlp_version: ${{ steps.check.outputs.yt_dlp_version }}
    steps:
      - name: Check yt-dlp latest release
        id: check
        run: |
          if ! latest_release=$(curl -sf "https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest" | jq -r .tag_name); then
            echo "Error: Failed to fetch latest yt-dlp release"
            exit 1
          fi
          echo "yt_dlp_version=$latest_release" >> $GITHUB_OUTPUT

          previous_version=$(curl -sf "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.body' | grep -o 'yt-dlp version: [^ ]*' | cut -d' ' -f3 || echo "none")

          echo "Latest yt-dlp version: $latest_release"
          
          is_new_version=false
          if [[ "$latest_release" != "$previous_version" ]]; then
            is_new_version=true
            echo "New yt-dlp version detected: $latest_release (previous: $previous_version)"
          fi
          
          if [[ "$is_new_version" == "true" ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             [[ "${{ github.event_name }}" == "push" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Building new Docker image with yt-dlp version: $latest_release (previous: $previous_version)"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "No new yt-dlp version. Current: $latest_release"
          fi

  build-and-push-image:
    needs: check-yt-dlp-release
    if: needs.check-yt-dlp-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    # One release at a time: two concurrent runs would otherwise pick the same
    # free tag, and an older build could overwrite a newer :latest.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
      with:
        platforms: all

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ env.OWNER }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Login to GitHub Container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ env.OWNER }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Tag is the UTC date; a second release the same day (a push after the
    # daily build, or a same-day yt-dlp hotfix) gets .1, then .2 etc. Checks
    # git tags, not releases: the release action reuses an existing tag.
    - name: Version
      id: version
      run: |
        date="$(date -u +'%Y-%m-%d')"
        version="$date"; n=0
        while git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; do
          n=$((n+1)); version="$date.$n"
        done
        echo "date=$date" >> $GITHUB_OUTPUT
        echo "version=$version" >> $GITHUB_OUTPUT

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: |
          YTDLP_VERSION=${{ needs.check-yt-dlp-release.outputs.yt_dlp_version }}
        tags: |
          ${{ env.REPOSITORY }}:${{ steps.version.outputs.version }},
          ${{ env.REPOSITORY }}:latest,
          ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ steps.version.outputs.version }},
          ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:latest

    # The image is already pushed, so this cannot stop a bad build from
    # reaching :latest, but it fails the run (and the release below) loudly
    # instead of letting a binary that cannot even print its version sit
    # behind a green check. Both platforms: arm64 runs under the QEMU set up
    # above.
    - name: Smoke test
      run: |
        for platform in linux/amd64 linux/arm64; do
          echo "== $platform"
          docker run --rm --platform "$platform" --entrypoint '' \
            "${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ steps.version.outputs.version }}" \
            yt-dlp --version
        done

    - name: Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ steps.version.outputs.version }}" \
          --generate-notes \
          --notes "Build date: ${{ steps.version.outputs.date }}
        yt-dlp version: ${{ needs.check-yt-dlp-release.outputs.yt_dlp_version }}"
