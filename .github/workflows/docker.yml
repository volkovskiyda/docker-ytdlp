name: Create and publish a Docker image

on:
  workflow_dispatch:

  schedule:
    # Daily: the check job is a single API call and only builds when yt-dlp
    # published a new release, so a weekly cron just adds up to six days of lag
    # (2026.10.26 shipped on a Monday and would have waited for Sunday).
    # 03:13 UTC is after yt-dlp's usual late-evening-UTC release window.
    - cron: '13 3 * * *'

  push:
    branches: [ "main" ]
    # A docs-only push would otherwise publish a new image and release with
    # the same yt-dlp and the same image contents.
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'

  repository_dispatch:
    types: [yt-dlp-release]

# Read-only by default; build-and-push-image asks for what it needs.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  REPOSITORY: ${{ github.repository_owner }}/ytdlp

jobs:
  check-yt-dlp-release:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      yt_dlp_version: ${{ steps.check.outputs.yt_dlp_version }}
    steps:
      - name: Check yt-dlp latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        # gh, not `curl | jq`: jq exits 0 on the empty output of a failed
        # curl, so that guard never fired and the run went on to build with
        # an empty version. gh exits non-zero on HTTP errors and its requests
        # are authenticated, so they do not share the anonymous rate limit.
        run: |
          set -o pipefail
          if ! latest_release=$(gh api repos/yt-dlp/yt-dlp/releases/latest --jq .tag_name) \
             || [[ -z "$latest_release" ]]; then
            echo "Error: Failed to fetch latest yt-dlp release"
            exit 1
          fi
          echo "yt_dlp_version=$latest_release" >> "$GITHUB_OUTPUT"

          previous_version=$(gh release view --repo "$GITHUB_REPOSITORY" --json body --jq .body \
            | grep -o 'yt-dlp version: [^ ]*' | cut -d' ' -f3) || previous_version=none

          echo "Latest yt-dlp version: $latest_release"
          
          is_new_version=false
          if [[ "$latest_release" != "$previous_version" ]]; then
            is_new_version=true
            echo "New yt-dlp version detected: $latest_release (previous: $previous_version)"
          fi
          
          if [[ "$is_new_version" == "true" ]] || \
             [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             [[ "${{ github.event_name }}" == "push" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Building new Docker image with yt-dlp version: $latest_release (previous: $previous_version)"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "No new yt-dlp version. Current: $latest_release"
          fi

  build-and-push-image:
    needs: check-yt-dlp-release
    if: needs.check-yt-dlp-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    # One release at a time: two concurrent runs would otherwise pick the same
    # free tag, and an older build could overwrite a newer :latest.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ env.OWNER }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Login to GitHub Container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ env.OWNER }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Tag is the UTC date; a second release the same day (a push after the
    # daily build, or a same-day yt-dlp hotfix) gets .1, then .2 etc. Checks
    # git tags, not releases: the release action reuses an existing tag.
    - name: Version
      id: version
      run: |
        date="$(date -u +'%Y-%m-%d')"
        version="$date"; n=0
        while git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; do
          n=$((n+1)); version="$date.$n"
        done
        echo "date=$date" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # Date tags only: :latest moves in "Tag latest", once the smoke test has
    # passed, so a broken build never reaches the tag users pull.
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: |
          YTDLP_VERSION=${{ needs.check-yt-dlp-release.outputs.yt_dlp_version }}
        tags: |
          ${{ env.REPOSITORY }}:${{ steps.version.outputs.version }}
          ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ steps.version.outputs.version }}

    # Both platforms: arm64 runs under the QEMU set up above. Without a URL,
    # yt-dlp -v prints its version and the ffmpeg and JS runtime it found,
    # then exits 2, so this checks the whole toolchain without any network.
    # A missing ffmpeg or deno shows as "exe versions: none" or
    # "JS runtimes: none", which `--version` alone would not catch.
    - name: Smoke test
      env:
        IMAGE: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ steps.version.outputs.version }}
        YTDLP_VERSION: ${{ needs.check-yt-dlp-release.outputs.yt_dlp_version }}
      run: |
        for platform in linux/amd64 linux/arm64; do
          echo "== $platform"
          out=$(docker run --rm --platform "$platform" "$IMAGE" -v --ignore-config 2>&1) || true
          grep -E 'yt-dlp version|exe versions|JS runtimes' <<<"$out" || { echo "$out"; exit 1; }
          grep -qF "yt-dlp version stable@$YTDLP_VERSION " <<<"$out"
          grep -q 'exe versions: ffmpeg ' <<<"$out"
          grep -q 'JS runtimes: deno-' <<<"$out"
        done

    # Copies the tested manifest list, so :latest has the same digest as the
    # date tag; nothing is rebuilt.
    - name: Tag latest
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        for repo in "$REPOSITORY" "$REGISTRY/$REPOSITORY"; do
          docker buildx imagetools create -t "$repo:latest" "$repo:$VERSION"
        done

    - name: Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ steps.version.outputs.version }}" \
          --target "$GITHUB_SHA" \
          --generate-notes \
          --notes "Build date: ${{ steps.version.outputs.date }}
        yt-dlp version: ${{ needs.check-yt-dlp-release.outputs.yt_dlp_version }}"
